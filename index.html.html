<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cardápio — Doce Encanto</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Great+Vibes&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#1B0F0B;--bg2:#140B08;--card:#2B1A13;--ink:#FFF5E8;--ink2:#D7B78D;--gold:#C69A52;--gold2:#E9CF98;--line:rgba(198,154,82,.38);--stage:#0C0605;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:inherit}html,body{height:100%}
body{margin:0;background:var(--stage);display:grid;place-items:center;color:var(--ink);font:400 16px/1.4 Inter,system-ui,sans-serif}
button{font:inherit;color:inherit;cursor:pointer}
.frame{width:min(100vw,calc(100dvh*9/16));height:100%;container-type:inline-size;position:relative;overflow:hidden;display:flex;flex-direction:column;background:radial-gradient(120% 60% at 50% 0,#2e1b13,var(--bg) 60%);box-shadow:0 0 0 1px var(--line),0 30px 80px -20px #000}
.frame::after{content:"";position:absolute;inset:1.6cqw;border:1px solid var(--gold);opacity:.55;pointer-events:none;z-index:30}
.frame::before{content:"";position:absolute;inset:2.6cqw;border:1px solid var(--gold);opacity:.2;pointer-events:none;z-index:30}
.gold{background:linear-gradient(110deg,#F1DDAA,#C69A52 40%,#8F6A2B 58%,#E6C77F);-webkit-background-clip:text;background-clip:text;color:transparent}
.script{font-family:'Great Vibes','Brush Script MT',cursive}
.serif,h2,h3{font-family:'Cormorant Garamond',Georgia,serif}
h2,h3{margin:0;font-weight:600}
.orn{display:flex;align-items:center;gap:2.4cqw;justify-content:center;color:var(--gold);font-size:3cqw}
.orn::before,.orn::after{content:"";height:1px;width:14cqw;background:linear-gradient(90deg,transparent,var(--gold))}.orn::after{transform:scaleX(-1)}
.cover{position:absolute;inset:0;z-index:20;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;text-align:center;padding:0 9cqw 13cqw;gap:2.6cqw;background-image:linear-gradient(180deg,rgba(12,6,5,.55) 0%,rgba(12,6,5,0) 22%,rgba(12,6,5,.35) 52%,rgba(12,6,5,.93) 80%,#0C0605 100%),var(--hero);background-size:100% 100%,cover;background-position:0 0,center;transition:transform .8s cubic-bezier(.7,0,.2,1)}
.cover.off{transform:translateY(-102%)}
.eyebrow{letter-spacing:.34em;font-size:2.9cqw;color:var(--gold2)}
.cover .logo{font-size:23cqw;line-height:1}
.cover .tg{font:italic 500 6cqw/1.2 'Cormorant Garamond',Georgia,serif;color:var(--ink)}
.btn{border:0;border-radius:99cqw;padding:3.4cqw 6cqw;font-weight:500;font-size:3.6cqw;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:2cqw;background:linear-gradient(110deg,#F1DDAA,#C69A52 45%,#A87B35);color:#241510;box-shadow:0 8px 24px -8px rgba(198,154,82,.6)}
.btn svg{width:5cqw;height:5cqw}.btn.alt{background:none;color:var(--gold2);border:1px solid var(--gold);box-shadow:none}
.cover .btn{margin-top:3cqw;padding:4cqw 11cqw;font-size:3.8cqw}
.top{position:relative;text-align:center;padding:7cqw 4cqw 3.5cqw;background-image:linear-gradient(180deg,rgba(27,15,11,.55),rgba(27,15,11,.9)),var(--hero);background-size:100% 100%,cover;background-position:0 0,50% 52%;border-bottom:1px solid var(--line)}
.top .logo{font-size:14cqw;line-height:1.05}
.top .eyebrow{font-size:2.6cqw}
.tabs{display:flex;margin:0 4cqw;border-bottom:1px solid var(--line)}
.tabs button{flex:1;background:none;border:0;border-bottom:2px solid transparent;padding:3cqw 0;font:600 4.8cqw 'Cormorant Garamond',Georgia,serif;letter-spacing:.06em;color:var(--ink2)}
.tabs button.on{color:var(--gold2);border-color:var(--gold)}
.list{flex:1;overflow-y:auto;padding:4cqw 5cqw;display:flex;flex-direction:column;gap:3cqw;scrollbar-width:none}
.list::-webkit-scrollbar{display:none}.list[hidden]{display:none}
.sec{text-align:center;display:flex;flex-direction:column;gap:1cqw;margin-bottom:1cqw}
.sec h2{font-size:7cqw;line-height:1.05}.sec p{margin:0;font:italic 500 3.8cqw 'Cormorant Garamond',Georgia,serif;color:var(--ink2)}
.it{display:flex;gap:3.4cqw;align-items:center;background:linear-gradient(145deg,#35211a,#241510);border:1px solid var(--line);border-radius:3cqw;padding:3cqw;box-shadow:0 10px 26px -14px #000}
.it img{width:22cqw;height:22cqw;object-fit:cover;border-radius:2cqw;flex:none;border:1px solid var(--gold);box-shadow:0 0 0 1cqw rgba(198,154,82,.12)}
.tx{flex:1;min-width:0}.tx h3{font-size:5.6cqw;line-height:1.05;color:var(--ink)}
.tx p{margin:1cqw 0 1.4cqw;font-size:3cqw;color:var(--ink2);line-height:1.3}.tx b{font:600 4.6cqw 'Cormorant Garamond',Georgia,serif;color:var(--gold2)}.tx b small{font:400 2.8cqw Inter,sans-serif;color:var(--ink2)}
.st{display:flex;align-items:center;gap:2cqw;font-weight:500;font-size:4cqw}.st span{min-width:4.5cqw;text-align:center}
.st button{width:8.6cqw;height:8.6cqw;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold2);font-size:4.6cqw;line-height:1;padding:0}
.st button:active{background:var(--gold);color:#241510}
.lead{margin:0;font-size:3.3cqw;color:var(--ink2);text-align:center}
.sizes{display:flex;gap:2cqw}.sizes button{flex:1;padding:2.4cqw 0;border:1px solid var(--gold);border-radius:99cqw;background:none;font-size:3.4cqw;color:var(--gold2)}
.sizes button.on{background:linear-gradient(110deg,#F1DDAA,#C69A52);color:#241510;border-color:transparent;font-weight:500}
.bar{height:1.6cqw;background:rgba(215,183,141,.2);border-radius:1cqw;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#C69A52,#F1DDAA);transition:width .3s}
.opt{display:flex;justify-content:space-between;align-items:center;padding:2cqw 0;border-bottom:1px solid var(--line);font:600 4.6cqw 'Cormorant Garamond',Georgia,serif}.opt small{font:400 3cqw Inter,sans-serif;color:var(--ink2)}
.foot{position:relative;z-index:2;display:flex;align-items:center;gap:3cqw;padding:3.6cqw 6cqw 4cqw;background:var(--bg2);border-top:1px solid var(--gold)}
.sum{flex:1;background:none;border:0;text-align:left;padding:0;line-height:1.1}
.sum small{display:block;font-size:2.8cqw;color:var(--ink2);text-decoration:underline;text-underline-offset:.6cqw}.sum b{font:600 6.6cqw 'Cormorant Garamond',Georgia,serif;color:var(--gold2)}
#sheet{position:absolute;inset:0;z-index:25;background:var(--bg);display:flex;flex-direction:column;padding:8cqw 6cqw 6cqw;gap:2.6cqw;transform:translateY(100%);transition:transform .35s}
#sheet.open{transform:none}
.hd{display:flex;justify-content:space-between;align-items:center}.hd h3{font-size:8cqw}.hd .btn{padding:1.6cqw 4cqw}
.items{flex:1;overflow-y:auto}
.li{display:flex;justify-content:space-between;gap:2cqw;padding:2.4cqw 0;border-bottom:1px solid var(--line);font-size:3.6cqw}
.li small{display:block;color:var(--ink2);font-size:3cqw}.li button{border:1px solid var(--gold);background:none;color:var(--gold2);border-radius:99cqw;padding:.4cqw 2.4cqw;margin-left:2cqw}
.f{width:100%;padding:2.8cqw;border:1px solid var(--line);border-radius:2cqw;background:var(--card);color:var(--ink);font:inherit;font-size:max(16px,3.6cqw)}
.tot{display:flex;justify-content:space-between;align-items:baseline;font-size:4cqw}.tot b{font:600 7cqw 'Cormorant Garamond',Georgia,serif;color:var(--gold2)}
#toast{position:absolute;left:50%;bottom:24cqw;transform:translate(-50%,20cqw);background:var(--gold);color:#241510;padding:2.4cqw 5cqw;border-radius:99cqw;font-size:3.4cqw;font-weight:500;white-space:nowrap;transition:.3s;z-index:40;opacity:0}
#toast.on{transform:translate(-50%,0);opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>
<main class="frame">
<section class="cover" id="cover">
<div class="eyebrow">PALHETERIA ARTESANAL</div>
<div class="script logo gold">Doce Encanto</div>
<div class="orn">✦</div>
<div class="tg">Uma mordida. Uma paixão.</div>
<button class="btn" onclick="openMenu()">Abrir cardápio</button>
</section>
<header class="top"><div class="eyebrow">CARDÁPIO</div><div class="script logo gold">Doce Encanto</div><div class="orn" style="margin-top:.6cqw">✦</div></header>
<nav class="tabs"><button class="on" id="tp" onclick="tab('p')">Palhas</button><button id="tc" onclick="tab('c')">Caixas Gourmet</button></nav>
<section class="list" id="vp"></section>
<section class="list" id="vc" hidden>
<div class="sec"><h2 class="gold">Monte sua Caixa Gourmet</h2><p>Escolha o tamanho e os sabores que mais ama.</p></div>
<div class="sizes" id="sizes"></div><div id="prog" class="lead"></div><div class="bar"><i id="fill"></i></div><div id="opts"></div>
<button class="btn alt" onclick="addBox()">Adicionar caixa ao pedido · <span id="btot"></span></button>
</section>
<footer class="foot">
<button class="sum" onclick="sheet(1)" aria-label="Revisar pedido"><small id="cnt">Seu pedido</small><b id="tot">R$ 0,00</b></button>
<button class="btn" onclick="send()"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21l1.6-4.4A8.5 8.5 0 1 1 8 19.6L3 21z"/><path d="M9 9.5c0 3 2.5 5.5 5.5 5.5l1-1.5-2-1-.8.8a3.5 3.5 0 0 1-1.5-1.5l.8-.8-1-2z"/></svg>Pedir pelo WhatsApp</button>
</footer>
<aside id="sheet" aria-label="Revisar pedido">
<div class="hd"><h3 class="gold">Seu pedido</h3><button class="btn alt" onclick="sheet(0)">Fechar</button></div>
<div class="items" id="items"></div>
<div class="tot"><span>Total</span><b id="tot2">R$ 0,00</b></div>
<input class="f" id="nm" placeholder="Seu nome (opcional)" autocomplete="name">
<textarea class="f" id="ob" rows="2" placeholder="Observações (opcional)"></textarea>
<button class="btn" onclick="send()">Enviar pedido pelo WhatsApp</button>
</aside>
<div id="toast" role="status"></div>
</main>

document.documentElement.style.setProperty('--hero',`url(${HERO})`);
const WA="5531993675471",$=id=>document.getElementById(id),R=v=>v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let q=P.map(()=>0),boxes=[],size=6,sel=P.map(()=>0),tt;
const sum=a=>a.reduce((x,y)=>x+y,0);
function openMenu(){$('cover').classList.add('off')}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('on');clearTimeout(tt);tt=setTimeout(()=>e.classList.remove('on'),2000)}
function tab(t){$('vp').hidden=t!='p';$('vc').hidden=t!='c';$('tp').classList.toggle('on',t=='p');$('tc').classList.toggle('on',t=='c')}
function sheet(o){$('sheet').classList.toggle('open',!!o)}
const stp=(f,i)=>`<div class="st"><button onclick="${f}(${i},-1)" aria-label="Menos">−</button><span id="${f}${i}">0</span><button onclick="${f}(${i},1)" aria-label="Mais">+</button></div>`;
$('vp').innerHTML='<div class="sec"><h2 class="gold">Os queridinhos da Doce Encanto</h2><p>Os sabores que conquistam na primeira mordida.</p></div>'+P.map((p,i)=>`<article class="it"><img src="${IMG[i]}" alt="Palha italiana ${p[0]}"><div class="tx"><h3>${p[0]}</h3><p>${p[1]}</p><b>${R(p[2])} <small>/ un.</small></b></div>${stp('ch',i)}</article>`).join('');
$('opts').innerHTML=P.map((p,i)=>`<div class="opt"><span>${p[0]} <small>${R(p[2])}</small></span>${stp('cs',i)}</div>`).join('');
function ch(i,d){if(d<0&&!q[i])return;q[i]+=d;render()}
function cs(i,d){if(d>0&&sum(sel)>=size)return toast('A caixa já está completa');if(d<0&&!sel[i])return;sel[i]+=d;box()}
function box(){$('sizes').innerHTML=[4,6,8,12].map(s=>`<button class="${s==size?'on':''}" onclick="size=${s};sel=P.map(()=>0);box()">${s} un.</button>`).join('');
$('prog').textContent=`Você selecionou ${sum(sel)} de ${size} unidades`;$('fill').style.width=sum(sel)/size*100+'%';
sel.forEach((v,i)=>$('cs'+i).textContent=v);$('btot').textContent=R(sel.reduce((a,n,i)=>a+n*P[i][2],0))}
function addBox(){const t=sum(sel);if(t<size)return toast(`Faltam ${size-t} unidades para completar a caixa`);
boxes.push({size,p:sel.reduce((a,n,i)=>a+n*P[i][2],0),d:sel.map((n,i)=>n?n+'× '+P[i][0]:'').filter(Boolean).join(', ')});sel=P.map(()=>0);box();render();toast('Caixa adicionada ao pedido')}
function total(){return q.reduce((a,n,i)=>a+n*P[i][2],0)+boxes.reduce((a,b)=>a+b.p,0)}
function units(){return sum(q)+boxes.reduce((a,b)=>a+b.size,0)}
function render(){q.forEach((n,i)=>$('ch'+i).textContent=n);
$('cnt').textContent=units()?`${units()} un. · revisar pedido`:'Seu pedido';$('tot').textContent=$('tot2').textContent=R(total());
const it=[];q.forEach((n,i)=>n&&it.push(`<div class="li"><span>${n}× Palha ${P[i][0]}</span><span>${R(n*P[i][2])}<button onclick="q[${i}]=0;render()" aria-label="Remover">×</button></span></div>`));
boxes.forEach((b,i)=>it.push(`<div class="li"><span>Caixa Gourmet ${b.size} un.<small>${b.d}</small></span><span>${R(b.p)}<button onclick="boxes.splice(${i},1);render()" aria-label="Remover">×</button></span></div>`));
$('items').innerHTML=it.join('')||'<p class="lead">Sua próxima experiência deliciosa começa aqui.</p>'}
function send(){if(!units()){sheet(0);return toast('Adicione pelo menos um item')}
const L=['Olá, Doce Encanto! Gostaria de fazer um pedido:',''];
q.forEach((n,i)=>n&&L.push(`• ${n}× Palha Italiana ${P[i][0]} — ${R(n*P[i][2])}`));
boxes.forEach(b=>L.push(`• Caixa Gourmet ${b.size} un. (${b.d}) — ${R(b.p)}`));
L.push('','Total: '+R(total()));
const n=$('nm').value.trim(),o=$('ob').value.trim();n&&L.push('Nome: '+n);o&&L.push('Observações: '+o);
const a=document.createElement('a');a.href='https://wa.me/'+WA+'?text='+encodeURIComponent(L.join('\n'));a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
box();render();
</script></body></html>
